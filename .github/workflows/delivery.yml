name: Test and deliver Imagecraft

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: delivery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Tests and validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Lint GitHub Actions
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -color
      - name: Validate tagged release
        id: release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD origin/main
          node scripts/release.cjs "$RELEASE_TAG"

  container:
    name: Build and smoke-test container
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          push: false
          tags: imagecraft:check
          labels: |
            org.opencontainers.image.title=Imagecraft
            org.opencontainers.image.description=RHEL image mode guide and recipe workbench
            org.opencontainers.image.source=https://github.com/erikgraa/imagecraft
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Smoke-test non-root read-only container
        run: |
          docker run -d --name imagecraft-check --read-only --cap-drop=ALL --security-opt=no-new-privileges -p 127.0.0.1:8080:8080 imagecraft:check
          trap 'docker logs imagecraft-check; docker rm -f imagecraft-check' EXIT
          curl --fail --silent --retry 15 --retry-connrefused --retry-delay 1 http://127.0.0.1:8080/ > /dev/null
          node scripts/smoke.cjs http://127.0.0.1:8080/
          docker exec imagecraft-check node -e "if (process.getuid() === 0) process.exit(1)"
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish checked image
        if: github.event_name == 'push'
        env:
          VERSION: ${{ needs.check.outputs.version }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
          REF: ${{ github.ref }}
        run: |
          tags=()
          if [[ "$REF" == refs/heads/main ]]; then
            tags+=(edge)
          else
            tags+=("$VERSION")
            if [[ "$PRERELEASE" == false ]]; then
              tags+=(latest)
            fi
          fi
          for tag in "${tags[@]}"; do
            image="ghcr.io/erikgraa/imagecraft:$tag"
            docker tag imagecraft:check "$image"
            docker push "$image"
          done

  pages-artifact:
    name: Prepare public website
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: public

  pages:
    name: Deploy GitHub Pages
    needs: pages-artifact
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  release:
    name: Publish release notes
    needs: [check, container]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Create release from changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
        run: |
          node scripts/release.cjs "$RELEASE_TAG"
          flags=(--latest)
          if [[ "$PRERELEASE" == true ]]; then
            flags=(--prerelease --latest=false)
          fi
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo "Release already exists; leaving published notes unchanged."
          else
            gh release create "$RELEASE_TAG" --verify-tag --title "Imagecraft $RELEASE_TAG" --notes-file release-notes.md "${flags[@]}"
          fi
