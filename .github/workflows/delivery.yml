name: Test and deliver Imagecraft

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: delivery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Tests and validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Lint GitHub Actions
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -color
      - name: Validate tagged release
        id: release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD origin/main
          node scripts/release.cjs "$RELEASE_TAG"

  container:
    name: Build and smoke-test container
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: imagecraft:check
          labels: |
            org.opencontainers.image.title=Imagecraft
            org.opencontainers.image.description=RHEL image mode guide and recipe workbench
            org.opencontainers.image.source=https://github.com/erikgraa/imagecraft
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Smoke-test non-root read-only container
        run: |
          docker run -d --name imagecraft-check --read-only --cap-drop=ALL --security-opt=no-new-privileges -p 127.0.0.1:8080:8080 imagecraft:check
          trap 'docker logs imagecraft-check; docker rm -f imagecraft-check' EXIT
          curl --fail --silent --retry 15 --retry-connrefused --retry-delay 1 http://127.0.0.1:8080/ > /dev/null
          node scripts/smoke.cjs http://127.0.0.1:8080/
          docker exec imagecraft-check node -e "if (process.getuid() === 0) process.exit(1)"
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish checked image
        if: github.event_name == 'push'
        env:
          VERSION: ${{ needs.check.outputs.version }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
          REF: ${{ github.ref }}
        run: |
          tags=()
          if [[ "$REF" == refs/heads/main ]]; then
            tags+=(edge)
          else
            tags+=("$VERSION")
            if [[ "$PRERELEASE" == false ]]; then
              tags+=(latest)
            fi
          fi
          for tag in "${tags[@]}"; do
            image="ghcr.io/erikgraa/imagecraft:$tag"
            docker tag imagecraft:check "$image"
            docker push "$image"
          done

  pages-artifact:
    name: Prepare public website
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public

  pages:
    name: Deploy GitHub Pages
    needs: pages-artifact
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  release:
    name: Publish release notes
    needs: [check, container]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Create release from changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
        run: |
          node scripts/release.cjs "$RELEASE_TAG"
          flags=(--latest)
          if [[ "$PRERELEASE" == true ]]; then
            flags=(--prerelease --latest=false)
          fi
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo "Release already exists; leaving published notes unchanged."
          else
            gh release create "$RELEASE_TAG" --verify-tag --title "Imagecraft $RELEASE_TAG" --notes-file release-notes.md "${flags[@]}"
          fi
